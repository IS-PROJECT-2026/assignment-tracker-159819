<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assignment Tracker</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <main class="app-container">

        <!-- Application Header -->
        <header class="app-header">

            <h1>
                Assignment Tracker
            </h1>

            <p>
                Keep track of your academic assignments and deadlines.
            </p>

        </header>


        <!-- Assignment Form -->
        <section
            class="assignment-form-section"
            aria-labelledby="form-title"
        >

            <h2 id="form-title">
                Add New Assignment
            </h2>

            <form id="assignment-form">

                <div class="form-group">

                    <label for="assignment-title">
                        Assignment Title
                    </label>

                    <input
                        type="text"
                        id="assignment-title"
                        name="title"
                        placeholder="e.g. Database Management CAT"
                    >

                </div>


                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select
                        id="course"
                        name="course"
                    >

                        <option value="">
                            Select course
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="due-date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due-date"
                        name="due-date"
                    >

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority"
                    >

                        <option value="">
                            Select priority
                        </option>

                        <option value="low">
                            Low
                        </option>

                        <option value="medium">
                            Medium
                        </option>

                        <option value="high">
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Add any additional details..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Assignment
                </button>

            </form>

        </section>


        <!-- Assignment Statistics -->
        <section
            class="statistics-section"
            aria-labelledby="statistics-title"
        >

            <div class="section-header">

                <h2 id="statistics-title">
                    Assignment Overview
                </h2>

            </div>


            <div class="statistics-grid">

                <div class="stat-card">

                    <span class="stat-label">
                        Total
                    </span>

                    <strong
                        id="total-stat"
                        class="stat-value"
                    >
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span class="stat-label">
                        Pending
                    </span>

                    <strong
                        id="pending-stat"
                        class="stat-value"
                    >
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span class="stat-label">
                        Completed
                    </span>

                    <strong
                        id="completed-stat"
                        class="stat-value"
                    >
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span class="stat-label">
                        Overdue
                    </span>

                    <strong
                        id="overdue-stat"
                        class="stat-value"
                    >
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span class="stat-label">
                        Completion Rate
                    </span>

                    <strong
                        id="completion-rate-stat"
                        class="stat-value"
                    >
                        0%
                    </strong>

                </div>

            </div>


            <!-- Assignment Progress -->
            <div class="progress-section">

                <div class="progress-header">

                    <div>

                        <h3>
                            Overall Progress
                        </h3>

                        <p
                            id="progress-text"
                            class="progress-text"
                        >
                            0 of 0 assignments completed
                        </p>

                    </div>

                    <strong
                        id="progress-percentage"
                        class="progress-percentage"
                    >
                        0%
                    </strong>

                </div>


                <div
                    class="progress-track"
                    role="progressbar"
                    aria-label="Assignment completion progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    id="assignment-progress"
                >

                    <div
                        class="progress-bar"
                        id="progress-bar"
                    ></div>

                </div>

            </div>

        </section>


        <!-- Assignment List -->
        <section
            class="assignments-section"
            aria-labelledby="assignments-title"
        >

            <div class="section-header">

                <h2 id="assignments-title">
                    My Assignments
                </h2>

                <span class="assignment-count">
                    0 assignments
                </span>

            </div>


            <!-- Search -->
            <div class="search-container">

                <label for="assignment-search">
                    Search assignments
                </label>

                <input
                    type="search"
                    id="assignment-search"
                    placeholder="Search by title or course..."
                    autocomplete="off"
                >

            </div>


            <!-- Course Filter -->
            <div class="filter-container">

                <label for="course-filter">
                    Filter by course
                </label>

                <select id="course-filter">

                    <option value="">
                        All Courses
                    </option>

                </select>

            </div>


            <!-- Deadline Sort -->
            <div class="sort-container">

                <label for="deadline-sort">
                    Sort by deadline
                </label>

                <select id="deadline-sort">

                    <option value="soonest">
                        Due Date: Soonest First
                    </option>

                    <option value="latest">
                        Due Date: Latest First
                    </option>

                </select>

            </div>


            <!-- Assignment Cards -->
            <div
                id="assignment-list"
                class="assignment-list"
            >
            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
