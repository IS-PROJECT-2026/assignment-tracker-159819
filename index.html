<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app-container">

        <header class="app-header">
            <h1>Assignment Tracker</h1>
            <p>Keep track of your academic assignments and deadlines.</p>
        </header>

        <!-- Assignment Form -->
        <section class="assignment-form-section" aria-labelledby="form-title">
            <h2 id="form-title">Add New Assignment</h2>

            <form id="assignment-form">

                <div class="form-group">
                    <label for="assignment-title">
                        Assignment Title
                    </label>

                    <input
                        type="text"
                        id="assignment-title"
                        name="title"
                        placeholder="e.g. Database Management CAT"
                    >
                </div>

                <div class="form-group">
                    <label for="course">
                        Course
                    </label>

                    <select id="course" name="course">
                        <option value="">Select course</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="due-date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due-date"
                        name="due-date"
                    >
                </div>

                <div class="form-group">
                    <label for="priority">
                        Priority
                    </label>

                    <select id="priority" name="priority">
                        <option value="">Select priority</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Add any additional details..."
                    ></textarea>
                </div>

                <button
                    type="submit"
                    class="submit-button"
                >
                    Add Assignment
                </button>

            </form>
        </section>

        <!-- Assignment List -->
        <section
            class="assignments-section"
            aria-labelledby="assignments-title"
        >
            <div class="section-header">
                <h2 id="assignments-title">
                    My Assignments
                </h2>

                <span class="assignment-count">
                    0 assignments
                </span>
            </div>
            <div class="search-container">
                <label for="assignment-search">
                    Search assignments
                </label>

                <input
                    type="search"
                    id="assignment-search"
                    placeholder="Search by title or course..."
                    autocomplete="off"
                >
            </div>
            <div class="filter-container">
                <label for="course-filter">
                    Filter by course
                </label>

                <select id="course-filter">
                    <option value="">All Courses</option>
                </select>
            </div>

            <div
                id="assignment-list"
                class="assignment-list"
            >
            </div>
        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
